name: ci-cd

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Chat_API/Chat_API.slnx
      - name: Build
        run: dotnet build Chat_API/Chat_API.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Chat_API/Chat_API.slnx --configuration Release --no-build

  docker-image:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Chat_API/Chat_API/Dockerfile -t chat-api:${{ github.sha }} .
