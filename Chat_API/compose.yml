services:
  postgres:
    image: postgres:17
    container_name: chatbot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-db_co_pgvector}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Chat_API/Chat_API/Dockerfile
    container_name: chat_api
    restart: always
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-db_co_pgvector};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AiSettings__Provider: Gemini
      AiSettings__ApiKey: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      AiSettings__EmbeddingModel: ${AI_EMBEDDING_MODEL:-text-embedding-004}
      AiSettings__ChatModel: ${AI_CHAT_MODEL:-gemini-2.5-flash}
      AuthSettings__JwtKey: ${JWT_KEY:?JWT_KEY is required}
      SeedSettings__Enabled: "false"
      UploadSettings__RootPath: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
